{% extends "admin/base_site.html" %}

{% block content %}
<h1>{{ title }}</h1>

<div style="max-width: 600px;">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <fieldset class="module aligned">
            <div class="form-row">
                <label for="id_word_bank">Word Bank:</label>
                <select name="word_bank_id" id="id_word_bank" required>
                    <option value="">-- Select --</option>
                    {% for bank in word_banks %}
                    <option value="{{ bank.id }}">{{ bank.name }} ({{ bank.words.count }} words)</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-row">
                <label for="id_csv_file">CSV File:</label>
                <input type="file" name="csv_file" id="id_csv_file" accept=".csv,.tsv,.txt" required>
                <div class="help">
                    Comma-separated CSV with quoted fields: <code>"word","pronounce","definition"</code>.
                    <br>Example: <code>"abandon","","vt. 放弃"</code>
                </div>
            </div>

            <div class="form-row">
                <label for="id_delimiter">Delimiter:</label>
                <select name="delimiter" id="id_delimiter">
                    <option value="\t" selected>Tab</option>
                    <option value=",">Comma</option>
                </select>
            </div>
        </fieldset>

        <div class="submit-row">
            <input type="submit" value="Import" class="default">
            <a href="{% url 'admin:wordbank_wordbank_changelist' %}" class="button cancel-link">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
