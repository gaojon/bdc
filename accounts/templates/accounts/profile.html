{% extends "base.html" %}

{% block title %}Profile – BDC Vocabulary{% endblock %}

{% block content %}
<h1>Profile</h1>

<form method="post">
    {% csrf_token %}
    <label>
        Nickname
        <input type="text" name="nickname" value="{{ user.profile.nickname }}" maxlength="64">
    </label>
    <label>
        English Level
        <select name="english_level">
            <option value="beginner" {% if user.profile.english_level == "beginner" %}selected{% endif %}>Beginner</option>
            <option value="intermediate" {% if user.profile.english_level == "intermediate" %}selected{% endif %}>Intermediate</option>
            <option value="advanced" {% if user.profile.english_level == "advanced" %}selected{% endif %}>Advanced</option>
        </select>
    </label>
    <label>
        Sentence Complexity: <strong id="complexity-value">{{ user.profile.sentence_complexity }}</strong>
        <input type="range" name="sentence_complexity" min="1" max="9"
               value="{{ user.profile.sentence_complexity }}"
               oninput="document.getElementById('complexity-value').textContent = this.value">
    </label>
    <label>
        Daily Word Goal
        <input type="number" name="daily_word_goal" value="{{ user.profile.daily_word_goal }}" min="1" max="100">
    </label>
    <button type="submit">Save</button>
</form>
{% endblock %}
